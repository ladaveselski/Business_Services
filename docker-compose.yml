
services:
  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: business_services-minio
    command: minio server /data --console-address ":9001" --license /minio.license
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    volumes:
      - minio_data:/data
      - C:\minio\minio.license:/minio.license:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/aistor/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin admin12345;
      mc mb --ignore-existing local/metoda-media;
      mc anonymous set none local/metoda-media;
      echo 'bucket ready';
      "

volumes:
  minio_data: